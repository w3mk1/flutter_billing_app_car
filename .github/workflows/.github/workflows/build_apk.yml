name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. إعداد بيئة Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 4. تحميل الحزم والاعتمادات
      - name: Install dependencies
        run: flutter pub get

      # 5. بناء ملف APK للإنتاج
      - name: Build APK
        run: flutter build apk --release

      # 6. رفعه كملف قابل للتحميل (Artifact)
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: flutter-billing-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
